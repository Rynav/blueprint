# git-cliff configuration — https://git-cliff.org
# Changelog is generated from Conventional Commits. Do not hand-edit CHANGELOG.md.
# Note: in git-cliff 2.x `commit_parsers` / `protect_breaking_commits` live under [git].

[changelog]
header = "# Changelog\n\nAll notable changes to this project. Generated from Conventional Commits.\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for c in commits %}\
- {% if c.scope %}(**{{ c.scope }}**) {% endif %}{{ c.message }}
{% for line in c.body | default(value="") | split(pat="\n") %}\
{% if line is starting_with("shortcut:") %}\
  - {{ line }}
{% endif %}\
{% endfor %}\
{% for f in c.footers %}\
{% if f.token == "shortcut" %}\
  - {{ f.token }}{{ f.separator }} {{ f.value }}
{% endif %}\
{% endfor %}\
{% endfor %}
{% endfor %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}\
### BREAKING CHANGES
{% for c in breaking %}\
- {% if c.scope %}(**{{ c.scope }}**) {% endif %}{{ c.breaking_description | default(value=c.message) }}
{% endfor %}\
{% endif %}\
"""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^build|^ci", group = "Maintenance" },
]
